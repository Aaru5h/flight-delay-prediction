# DL milestone protocol. The Phase 0 contract still governs legacy AML runs.
contract_version: "2.0.0"
owner: interterrestrial
legacy_contract: configs/project_contract.yaml
audit_commit: 0aa2e04

data:
  manifest: configs/data_manifest.json
  source_years: [2013]
  extra_years: deferred_until_approved
  clean_test_period: null
  compute: cpu_compatible

target:
  name: substantial_delay
  source_column: arr_delay
  threshold_minutes: 15
  rule: "1 when arr_delay >= 15, 0 otherwise, for known arrivals"
  missing_policy: unknown_label_excluded_from_supervised_scoring
  disruption_label: deferred_until_explicit_cancellation_and_diversion_data_exist
  reference_known_flights: 327346

prediction_time:
  lead_time_minutes: [1440, 360, 120, 60]
  schedule_timezone: America/New_York
  cutoff: "UTC scheduled departure minus elapsed lead_time_minutes"
  invalid_cutoff_policy: count_and_exclude_from_experiments
  event_availability: "Event and input value must both be available by the cutoff"
  prohibited_target_flight_inputs: [dep_time, dep_delay, arr_time, arr_delay, air_time, tailnum]
  schedule_calendar: "Use minute-of-day cycles and holiday distance. Exclude raw month and day-of-year from v2."
  weather:
    source: origin_observation_persistence
    forecast_vintages: deferred
    latest_observation_max_age_minutes: 180
    trend_windows_hours: [3, 6]
    missing_policy: missing_with_indicator_and_coverage_count
  history:
    windows_days: [7, 28]
    groups: [carrier, route, origin]
    arrival_availability: "Use destination-local arrival converted to UTC with a documented availability buffer. Withhold unverifiable events."
    own_flight: excluded
    updates: "Earlier outcomes may enter later features once available, including during retrospective scoring. Model weights and operating decisions remain frozen."
  same_day_departures:
    policy: "Use prior flights only after actual departure and availability of every input are verified. Treat same-day features as conditional on instructor approval."
    unapproved_fallback: omit_same_day_departure_features_and_sequence_inputs
  leakage_check: "Perturb records unavailable by the cutoff and require unchanged features and predictions for that cutoff."

validation:
  fold_type: expanding_window_by_local_scheduled_service_date
  train_start: "2013-01-01"
  validation_months: ["2013-05", "2013-06", "2013-07", "2013-08", "2013-09", "2013-10"]
  train_end: "Last day before the validation month"
  grouping: "All lead times of a flight share its assignment within each fold"
  fit_availability: >
    Within each fold fit only with training labels available by the earliest
    validation prediction cutoff. Fit preprocessing inside that training
    population. Use the same rule at the retrospective boundary.
  retrospective_period: {start: "2013-11-01", end: "2013-12-31"}
  retrospective_policy: >
    This period was previously scored in AML. Run the final v2 comparison after
    freezing features, model selection, calibration and operating points.
    If an unseen year is approved, define it in a protocol revision before
    inspecting its outcomes.

model_selection:
  trials_per_model_per_feature_set: 40
  budget_policy: "Use the same number of configurations and folds for LR, XGBoost and each tuned neural model."
  primary_score: "Mean validation average precision across folds and lead times shared by the models being compared"
  seed: 42
  early_stopping: "Use a time-ordered holdout inside the training window for iterative models"
  required_models: [schedule_only, logistic_regression, xgboost, embedding_mlp]
  sequence_model_gate: "Reproducible MLP, verified sequence timestamps and masks, and passing leakage tests"
  comparisons:
    legacy_aml_features_at_60_minutes: [logistic_regression, xgboost, embedding_mlp]
    multi_lead_features: [schedule_only, logistic_regression, xgboost, embedding_mlp]
    conditional_multi_lead_models: [sequence_model]

evaluation:
  report_by: [lead_time_minutes, month]
  ranking_metrics: [average_precision, roc_auc]
  probability_metrics: [brier_score, brier_skill_score, equal_mass_ece]
  brier_reference: "Constant probability equal to the corresponding training population prevalence"
  ece_bins: 10
  calibration: "Fit per lead time on the most recent out-of-fold validation month, using labels available by the final fit cutoff"
  alert_budget_fraction: 0.10
  alert_budget_metrics: [precision, recall]
  alert_budget_rule: "Within a lead-time reporting cohort rank by probability, break ties by flight_row_id and count the top floor(0.10 * cohort size) alerts directly"
  bootstrap: {unit: local_scheduled_service_date, paired_across_models: true, resamples: 1000, confidence_level: 0.95, seed: 42}
  success:
    aml_xgboost_average_precision_at_60_minutes: 0.4846
    aml_reference: reports/phase5_aml_evaluation.json
    gates:
      - "At T-60, exceed the audited AML XGBoost average precision and the retuned XGBoost on matched v2 features."
      - "Beat the schedule-only benchmark at each lead time and attain positive Brier skill at each lead time."
      - "Pass all cutoff and perturbation tests."
    superiority_claim: "Require higher average precision and non-overlapping 95% intervals against matched retuned XGBoost at each lead time."

schemas:
  labelled_data:
    key: [flight_row_id]
    id_policy: "Preserve the Phase 1 ID derived from the source fingerprint and source row position"
  feature_table:
    key: [flight_row_id, lead_time_minutes]
    required_metadata: [sched_date, prediction_cutoff_utc, substantial_delay]
    estimator_inputs: "Use the versioned feature-manifest allowlist, including lead_time_minutes"
  fold_manifest:
    key: [flight_row_id, fold_id]
    required_metadata: [sched_date, split]
    split_values: [train, validation, retrospective]
  sequence_file:
    key: [flight_row_id, lead_time_minutes]
    origin_departures: 32
    origin_weather_readings: 12
    policy: "Order by event time, retain per-event UTC timestamps for audit, and use padding and a mask"
  predictions:
    key: [flight_row_id, lead_time_minutes, fold_id, model_name, run_id]
    required_fields: [flight_row_id, lead_time_minutes, fold_id, split, y_true, y_probability, model_name, run_id]
    policy: "Join by key, reconcile labels and populations, and require finite probabilities within [0, 1]"
  run_metadata:
    required_fields: [run_id, code_commit, raw_data_fingerprints, feature_manifest_version, fold_manifest_version, feature_set, model_config, seed, package_versions]
  results:
    format: json
    policy: "Use the saved evaluation results for all quantitative claims in the report and slides"

ownership:
  interterrestrial: {steps: [1, 2, 4], step_2_flaws: [18, 19, 22, 23]}
  Utkarshh014: {steps: [3]}
  MeetAhujaa: {steps: [5, 10], step_2_flaws: [20, 21]}
  Aarush: {steps: [6, 7]}
  Kevish_Sewliya: {steps: [8, 9], step_2_flaws: [24, 25, 26]}
